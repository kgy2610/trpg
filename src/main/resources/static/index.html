<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마지막 열차</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1>마지막 열차</h1>
        <p class="subtitle">밀실 미스터리 TRPG</p>

        <section class="card">
        <h2>방 만들기 (GM)</h2>
        <form id="create-form">
            <input id="create-nickname" type="text" maxlength="10" placeholder="닉네임" required>
            <button type="submit">방 만들기</button>
        </form>
        </section>

        <section class="card">
        <h2>방 입장 (플레이어)</h2>
        <form id="join-form">
            <input id="join-code" type="text" maxlength="6" placeholder="방 코드 (6자리)" required>
            <input id="join-nickname" type="text" maxlength="10" placeholder="닉네임" required>
            <button type="submit">입장</button>
        </form>
        </section>

        <p id="error" class="error" hidden></p>
    </main>
    <script src="/js/lobby.js"></script>
</body>
</html>
